{% extends "base.html" %}

{% block title %}Passwort einrichten - BENNO{% endblock %}

{% block content %}
  <section class="auth-panel" aria-labelledby="setup-title">
    <img
      class="brand-logo auth-panel__logo"
      src="{{ url_for('static', filename='img/benno-logo.svg') }}"
      alt="BENNO"
    >
    <p class="hero__eyebrow">Lokaler Setup-Link</p>
    <h1 id="setup-title">Passwort setzen</h1>
    {% if user %}
      <p class="hero__subtitle">{{ user.email }}</p>
    {% endif %}

    {% if error_message %}
      <p class="form-error" role="alert">{{ error_message }}</p>
    {% endif %}

    {% if user %}
      <form class="form-stack" method="post" action="{{ url_for('auth.setup_password', token=token) }}">
        <label for="password">Neues Passwort</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="password_confirmation">Passwort wiederholen</label>
        <input
          id="password_confirmation"
          name="password_confirmation"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button class="button" type="submit">Passwort speichern</button>
      </form>
    {% endif %}
  </section>
{% endblock %}
