{% extends "base.html" %}

{% block title %}Login - BENNO{% endblock %}

{% block content %}
  <section class="auth-panel" aria-labelledby="login-title">
    <img
      class="brand-logo auth-panel__logo"
      src="{{ url_for('static', filename='img/benno-logo.svg') }}"
      alt="BENNO"
    >
    <p class="hero__eyebrow">Besuchsberichte im B2B-Außendienst</p>
    <h1 id="login-title">BENNO</h1>
    <p class="hero__subtitle">B2B Encounter Notes and Next-step Organizer</p>

    {% if error_message %}
      <p class="form-error" role="alert">{{ error_message }}</p>
    {% endif %}

    <form class="form-stack" method="post" action="{{ url_for('auth.login') }}">
      <label for="email">E-Mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Passwort</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button class="button" type="submit">Anmelden</button>
    </form>
  </section>
{% endblock %}
