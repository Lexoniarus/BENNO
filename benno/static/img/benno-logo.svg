<?xml version="1.0" encoding="UTF-8"?>
<svg id="benno-logo-v3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 50.2" role="img" aria-labelledby="title desc">
  <title id="title">Benno logo</title>
  <desc id="desc">A Benno wordmark closely following the supplied yellow and navy reference style.</desc>
  <defs>
    <style>
      .st0 { fill: none; }
