[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benno"
version = "0.1.0"
description = "B2B Encounter Notes and Next-step Organizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-Login>=0.6",
    "Flask-SQLAlchemy>=3.1",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["benno*"]

[tool.setuptools.package-data]
benno = [
    "static/css/*.css",
    "static/img/*.svg",
    "static/js/*.js",
    "templates/admin/*.html",
    "templates/auth/*.html",
    "templates/sales/*.html",
    "templates/*.html",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
